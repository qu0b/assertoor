id: glamsterdam-devnet-6-eip2780-intrinsic-gas
name: "glamsterdam-devnet-6: EIP-2780 intrinsic gas and calldata repricing verification"
timeout: 1h
config:
  walletPrivkey: ""
  # EIP-2780: Reduces TX_BASE and restructures value-transfer costs into
  # explicit per-recipient components.
  #
  # Key invariants under EIP-2780 (Amsterdam, v6.0.0 EELS tag):
  #   TX_BASE = 12000  (was 21000 — PRIMARY CHANGE)
  #   TX_DATA_ZERO = 4 gas per zero calldata byte (unchanged from Prague)
  #   TX_DATA_NONZERO = 16 gas per non-zero calldata byte (unchanged from Prague)
  #   TX_DATA_TOKEN_STANDARD = 4 tokens per byte (zero=1tok, nonzero=4tok, cost 4/tok)
  #   TX_DATA_TOKEN_FLOOR = 16 gas per token (EIP-7976 floor rate)
  #   COLD_ACCOUNT_ACCESS = 3000  (recipient access charge, added separately)
  #   TX_VALUE_COST = 4244         (ETH transfer value charge)
  #   TRANSFER_LOG_COST = 1756     (ETH transfer log charge)
  #
  # For a SELF-TRANSFER (tx.to == tx.from):
  #   Pre-EIP-2780: intrinsic = 21000 (all baked into TX_BASE)
  #   Post-EIP-2780: intrinsic = TX_BASE = 12000
  #   → gasUsed CHANGES: 21000 → 12000
  #
  # For a NON-SELF ETH transfer (value > 0, to different address):
  #   Pre-EIP-2780: intrinsic = 21000
  #   Post-EIP-2780: TX_BASE + COLD_ACCOUNT_ACCESS + TRANSFER_LOG_COST + TX_VALUE_COST
  #                = 12000 + 3000 + 1756 + 4244 = 21000
  #   → gasUsed UNCHANGED (costs redistributed but total same)
  #
  # EIP-7976 INTERACTION (calldata floor):
  #   floor = TX_BASE + 64 × len(calldata) = 12000 + 64 × len
  #   (formula: len × TX_DATA_TOKEN_STANDARD × TX_DATA_TOKEN_FLOOR + TX_BASE)
  #   For 100 bytes: floor = 12000 + 6400 = 18400
  #
  #   Pre-EIP-2780 + EIP-7976: floor = 21000 + 64 × len → 27400 for 100 bytes
  #   Post-EIP-2780 + EIP-7976: floor = 12000 + 64 × len → 18400 for 100 bytes
  #
  # DISCRIMINATING TESTS:
  #   Test 1: Self-transfer with gas=15000
  #     - Pre-EIP-2780: intrinsic=21000 > gas=15000 → REJECTED ("intrinsic gas too low")
  #     - Post-EIP-2780: intrinsic=12000 < gas=15000 → ACCEPTED, gasUsed=12000
  #   Test 2: Self-transfer (cast send), observe gasUsed
  #     - Pre-EIP-2780: gasUsed = 21000
  #     - Post-EIP-2780: gasUsed = 12000
  #   Test 3: 100 zero bytes → eth_estimateGas
  #     - Pre-EIP-2780: estimate ≈ 27400 (floor = 21000 + 6400)
  #     - Post-EIP-2780: estimate ≈ 18400 (floor = 12000 + 6400)
  #   Test 4: 100 non-zero bytes → same floor (18400), same estimate as Test 3
  #   Test 5: Delta ≈ 0 (floor is length-only, not byte-value-based)

tasks:
  - name: check_clients_are_healthy
    title: "Check if at least one client is ready"
    id: clientCheck
    timeout: 5m
    config:
      minClientCount: 1

  - name: get_consensus_specs
    id: consensusSpecs
    title: "Get consensus chain specs"

  - name: check_consensus_slot_range
    title: "Wait for network to be stable (epoch 2)"
    timeout: 1h
    config:
      minEpochNumber: 2

  - name: generate_child_wallet
    id: testWallet
    title: "Generate funded wallet for intrinsic gas tests"
    config:
      prefundMinBalance: 100000000000000000  # 0.1 ETH
      walletSeed: "eip2780-intrinsic-gas-test"
    configVars:
      privateKey: "walletPrivkey"

  - name: run_shell
    title: "Install foundry (cast)"
    id: installFoundry
    timeout: 10m
    config:
      shell: bash
      shellArgs: [--login]
      command: |
        set -e
        if [ -x "/opt/foundry/.foundry/bin/cast" ]; then
          FOUNDRY_HOME=/opt/foundry
          echo "Using pre-installed foundry: $(/opt/foundry/.foundry/bin/cast --version)"
        else
          FOUNDRY_HOME=$(mktemp -d -t foundry-XXXXXXXXXX)
          export SHELL=/bin/bash
          export HOME=${FOUNDRY_HOME}
          curl -L https://foundry.paradigm.xyz | bash
          source ${FOUNDRY_HOME}/.bashrc || true
          ${FOUNDRY_HOME}/.foundry/bin/foundryup
        fi
        echo "::set-output foundryHome ${FOUNDRY_HOME}"
        echo "foundry installed at ${FOUNDRY_HOME}"

  # ─── Test 1: Discriminating test — send with gas=15000 to self ───────────────
  # EIP-2780: intrinsic for self-transfer = TX_BASE = 12000 < 15000 → ACCEPTED
  # Pre-EIP-2780: intrinsic = 21000 > 15000 → REJECTED ("intrinsic gas too low")
  - name: run_shell
    title: "Test 1: Self-transfer gas=15000 — discriminate EIP-2780 (12000) vs old (21000)"
    id: testDiscriminate
    timeout: 5m
    config:
      shell: bash
      shellArgs: [--login]
      envVars:
        WALLET_PRIVKEY: tasks.testWallet.outputs.childWallet.privkey
        WALLET_ADDRESS: tasks.testWallet.outputs.childWallet.address
        EL_RPC: tasks.clientCheck.outputs.goodClients[0].elRpcUrl
        FOUNDRY_HOME: tasks.installFoundry.outputs.foundryHome
      command: |
        set -e
        WALLET_PRIVKEY=$(echo $WALLET_PRIVKEY | jq -r)
        WALLET_ADDRESS=$(echo $WALLET_ADDRESS | jq -r)
        EL_RPC=$(echo $EL_RPC | jq -r)
        FOUNDRY_HOME=$(echo $FOUNDRY_HOME | jq -r)

        export PATH="${FOUNDRY_HOME}/.foundry/bin:$PATH"
        export SHELL=/bin/bash
        export HOME=${FOUNDRY_HOME}

        echo "=== Test 1: Self-transfer with explicit gas=15000 ==="
        echo "EIP-2780 TX_BASE=12000 → intrinsic=12000 < 15000 → ACCEPTED"
        echo "Pre-EIP-2780 TX_BASE=21000 → intrinsic=21000 > 15000 → REJECTED"
        echo ""

        # Use eth_sendRawTransaction with explicit gas=15000 to self
        # Build and sign raw tx with cast
        NONCE_HEX=$(curl -s -X POST -H "Content-Type: application/json" \
          --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_getTransactionCount\",\"params\":[\"${WALLET_ADDRESS}\",\"pending\"],\"id\":1}" \
          ${EL_RPC} | jq -r '.result')
        NONCE=$(printf '%d' "${NONCE_HEX}")

        CHAIN_ID_HEX=$(curl -s -X POST -H "Content-Type: application/json" \
          --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
          ${EL_RPC} | jq -r '.result')
        CHAIN_ID=$(printf '%d' "${CHAIN_ID_HEX}")

        echo "Sender: ${WALLET_ADDRESS}, Nonce: ${NONCE}, ChainID: ${CHAIN_ID}"

        # cast send with --gas-limit 15000 will fail on pre-EIP-2780 nodes (intrinsic > gas)
        SEND_OUTPUT=$(cast send \
          "${WALLET_ADDRESS}" \
          --value 1 \
          --gas-limit 15000 \
          --private-key "${WALLET_PRIVKEY}" \
          --rpc-url "${EL_RPC}" \
          --legacy \
          --json 2>&1 || true)

        echo "Raw output: ${SEND_OUTPUT}"
        echo "::set-output discriminateOutput ${SEND_OUTPUT}"

        # Check if this looks like a rejection or an acceptance
        if echo "${SEND_OUTPUT}" | grep -qi "intrinsic gas too low\|gas too low\|insufficient gas"; then
          echo ""
          echo "WARN: tx rejected — 'intrinsic gas too low'. EIP-2780 TX_BASE=12000 NOT implemented."
          echo "      Geth still uses TX_BASE=21000, which requires gas≥21000 for any tx."
          echo "      This is an expected failure — EIP-2780 is not yet implemented in geth."
          echo "::set-output eip2780Implemented false"
          exit 0
        fi

        TX_HASH=$(echo "${SEND_OUTPUT}" | jq -r '.transactionHash // empty' 2>/dev/null || true)
        TX_STATUS=$(echo "${SEND_OUTPUT}" | jq -r '.status // empty' 2>/dev/null || true)

        if [ -z "${TX_HASH}" ]; then
          echo ""
          echo "WARN: Unexpected rejection or parse error — could not extract tx hash."
          echo "      Output: ${SEND_OUTPUT}"
          echo "::set-output eip2780Implemented unknown"
          exit 0
        fi

        echo ""
        echo "Tx hash: ${TX_HASH}, status: ${TX_STATUS}"

        if [ "${TX_STATUS}" = "0x1" ] || [ "${TX_STATUS}" = "1" ]; then
          echo "PASS: tx with gas=15000 ACCEPTED. EIP-2780 TX_BASE=12000 is implemented. ✓"
          echo "      Intrinsic gas = 12000 (self-transfer) < gas limit 15000 → accepted."
          echo "::set-output eip2780Implemented true"
        else
          echo "WARN: tx was sent but status=${TX_STATUS} (reverted). Check logs."
          echo "::set-output eip2780Implemented unknown"
        fi

  # ─── Test 2: Simple ETH transfer — observe gasUsed ──────────────────────────
  - name: run_shell
    title: "Test 2: Self-transfer — verify gasUsed == 12000 (EIP-2780) vs 21000 (old)"
    id: testBase
    timeout: 5m
    config:
      shell: bash
      shellArgs: [--login]
      envVars:
        WALLET_PRIVKEY: tasks.testWallet.outputs.childWallet.privkey
        WALLET_ADDRESS: tasks.testWallet.outputs.childWallet.address
        EL_RPC: tasks.clientCheck.outputs.goodClients[0].elRpcUrl
        FOUNDRY_HOME: tasks.installFoundry.outputs.foundryHome
      command: |
        set -e
        WALLET_PRIVKEY=$(echo $WALLET_PRIVKEY | jq -r)
        WALLET_ADDRESS=$(echo $WALLET_ADDRESS | jq -r)
        EL_RPC=$(echo $EL_RPC | jq -r)
        FOUNDRY_HOME=$(echo $FOUNDRY_HOME | jq -r)

        export PATH="${FOUNDRY_HOME}/.foundry/bin:$PATH"
        export SHELL=/bin/bash
        export HOME=${FOUNDRY_HOME}

        echo "=== Test 2: Simple ETH Self-Transfer (TX_BASE observation) ==="
        echo "EIP-2780 (implemented): gasUsed = 12000"
        echo "Pre-EIP-2780 (not yet): gasUsed = 21000"
        echo ""

        # Send 1 wei to self with no calldata — purest measure of TX_BASE
        TX_JSON=$(cast send \
          "${WALLET_ADDRESS}" \
          --value 1 \
          --private-key "${WALLET_PRIVKEY}" \
          --rpc-url "${EL_RPC}" \
          --legacy \
          --json 2>/dev/null)

        TX_HASH=$(echo "${TX_JSON}" | jq -r '.transactionHash')
        TX_STATUS=$(echo "${TX_JSON}" | jq -r '.status')
        GAS_USED_HEX=$(echo "${TX_JSON}" | jq -r '.gasUsed')

        GAS_USED=$(printf '%d' "${GAS_USED_HEX}" 2>/dev/null || \
          python3 -c "print(int('${GAS_USED_HEX}', 16))" 2>/dev/null || echo "${GAS_USED_HEX}")

        echo "Tx hash:   ${TX_HASH}"
        echo "Tx status: ${TX_STATUS}"
        echo "Gas used:  ${GAS_USED}"
        echo "::set-output baseGasUsed ${GAS_USED}"

        if [ "${TX_STATUS}" != "0x1" ] && [ "${TX_STATUS}" != "1" ]; then
          echo "FAIL: ETH transfer tx failed (status=${TX_STATUS})"
          exit 1
        fi

        if [ "${GAS_USED}" -eq 12000 ]; then
          echo "PASS: gasUsed == 12000. EIP-2780 TX_BASE=12000 active for self-transfer. ✓"
        elif [ "${GAS_USED}" -eq 21000 ]; then
          echo "WARN: gasUsed == 21000. EIP-2780 NOT implemented — geth still uses TX_BASE=21000."
          echo "      Expected: 12000 (self-transfer costs only TX_BASE under EIP-2780)."
          echo "      This is a known gap. Reporting but not failing (EIP-2780 readiness check)."
        else
          echo "WARN: gasUsed == ${GAS_USED}, expected 12000 (EIP-2780) or 21000 (pre-EIP-2780)."
        fi

  # ─── Test 3: Tx with 100 zero bytes → floor 12000 + 64×100 = 18400 ──────────
  - name: run_shell
    title: "Test 3: Tx with 100 zero bytes — verify EIP-7976 floor == 18400"
    id: testZeroBytes
    timeout: 5m
    config:
      shell: bash
      shellArgs: [--login]
      envVars:
        WALLET_PRIVKEY: tasks.testWallet.outputs.childWallet.privkey
        WALLET_ADDRESS: tasks.testWallet.outputs.childWallet.address
        EL_RPC: tasks.clientCheck.outputs.goodClients[0].elRpcUrl
        FOUNDRY_HOME: tasks.installFoundry.outputs.foundryHome
      command: |
        set -e
        WALLET_PRIVKEY=$(echo $WALLET_PRIVKEY | jq -r)
        WALLET_ADDRESS=$(echo $WALLET_ADDRESS | jq -r)
        EL_RPC=$(echo $EL_RPC | jq -r)
        FOUNDRY_HOME=$(echo $FOUNDRY_HOME | jq -r)

        export PATH="${FOUNDRY_HOME}/.foundry/bin:$PATH"
        export SHELL=/bin/bash
        export HOME=${FOUNDRY_HOME}

        echo "=== Test 3: Tx with 100 zero calldata bytes ==="
        echo "EIP-2780+EIP-7976 floor = TX_BASE + 64×len = 12000 + 64×100 = 18400"
        echo "EIP-2780 zero-byte model: 12000 + COLD_ACCOUNT_ACCESS + 100×4 = 15400 (floor dominates)"
        echo "Pre-EIP-2780+EIP-7976 floor = 21000 + 64×100 = 27400"
        echo ""

        ZERO_CALLDATA="0x$(python3 -c "print('00' * 100)")"
        echo "Calldata: 0x00 × 100"

        ESTIMATE_JSON=$(curl -s -X POST \
          -H "Content-Type: application/json" \
          --data "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"eth_estimateGas\",
            \"params\": [{
              \"from\": \"${WALLET_ADDRESS}\",
              \"to\": \"0x000000000000000000000000000000000000dead\",
              \"value\": \"0x0\",
              \"data\": \"${ZERO_CALLDATA}\"
            }, \"latest\"],
            \"id\": 1
          }" \
          ${EL_RPC})

        ESTIMATE_HEX=$(echo "${ESTIMATE_JSON}" | jq -r '.result // empty')
        ESTIMATE=$(printf '%d' "${ESTIMATE_HEX}" 2>/dev/null || \
          python3 -c "print(int('${ESTIMATE_HEX}', 16))" 2>/dev/null || echo "0")

        echo "eth_estimateGas: ${ESTIMATE_HEX} = ${ESTIMATE} gas"
        echo "::set-output zeroBytesEstimate ${ESTIMATE}"

        # EIP-2780+7976 floor: 12000 + 64×100 = 18400
        # eth_estimateGas binary-search may overshoot by up to ~1.5%
        FLOOR_NEW=18400
        LOWER_NEW=$((FLOOR_NEW - 200))
        UPPER_NEW=$((FLOOR_NEW + 400))

        # Pre-EIP-2780+7976 floor: 21000 + 64×100 = 27400
        FLOOR_OLD=27400
        LOWER_OLD=$((FLOOR_OLD - 200))
        UPPER_OLD=$((FLOOR_OLD + 600))

        if [ "${ESTIMATE}" -ge "${LOWER_NEW}" ] && [ "${ESTIMATE}" -le "${UPPER_NEW}" ]; then
          echo "PASS: Estimate ${ESTIMATE} matches EIP-2780+EIP-7976 floor range [${LOWER_NEW}, ${UPPER_NEW}]. ✓"
          echo "      floor = TX_BASE(12000) + 64×100 = 18400"
        elif [ "${ESTIMATE}" -ge "${LOWER_OLD}" ] && [ "${ESTIMATE}" -le "${UPPER_OLD}" ]; then
          echo "WARN: Estimate ${ESTIMATE} matches pre-EIP-2780 floor (27400 = 21000 + 6400)."
          echo "      EIP-2780 TX_BASE=12000 NOT implemented. EIP-7976 floor uses old TX_BASE=21000."
        else
          echo "WARN: Estimate ${ESTIMATE} does not match EIP-2780+7976 floor (18400) or pre-EIP-2780 floor (27400)."
          echo "      Check client implementation."
        fi

  # ─── Test 4: Tx with 100 non-zero bytes → floor 12000 + 64×100 = 18400 ──────
  - name: run_shell
    title: "Test 4: Tx with 100 non-zero bytes — verify EIP-7976 floor == 18400"
    id: testNonzeroBytes
    timeout: 5m
    config:
      shell: bash
      shellArgs: [--login]
      envVars:
        WALLET_PRIVKEY: tasks.testWallet.outputs.childWallet.privkey
        WALLET_ADDRESS: tasks.testWallet.outputs.childWallet.address
        EL_RPC: tasks.clientCheck.outputs.goodClients[0].elRpcUrl
        FOUNDRY_HOME: tasks.installFoundry.outputs.foundryHome
      command: |
        set -e
        WALLET_PRIVKEY=$(echo $WALLET_PRIVKEY | jq -r)
        WALLET_ADDRESS=$(echo $WALLET_ADDRESS | jq -r)
        EL_RPC=$(echo $EL_RPC | jq -r)
        FOUNDRY_HOME=$(echo $FOUNDRY_HOME | jq -r)

        export PATH="${FOUNDRY_HOME}/.foundry/bin:$PATH"
        export SHELL=/bin/bash
        export HOME=${FOUNDRY_HOME}

        echo "=== Test 4: Tx with 100 non-zero calldata bytes ==="
        echo "EIP-2780+EIP-7976 floor = 12000 + 64×100 = 18400"
        echo "EIP-2780 nonzero-byte model: 12000 + COLD_ACCOUNT_ACCESS + 100×16 = 16600 (floor dominates)"
        echo "Pre-EIP-2780+EIP-7976 floor = 21000 + 64×100 = 27400"
        echo ""

        NONZERO_CALLDATA="0x$(python3 -c "print('ff' * 100)")"
        echo "Calldata: 0xff × 100"

        ESTIMATE_JSON=$(curl -s -X POST \
          -H "Content-Type: application/json" \
          --data "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"eth_estimateGas\",
            \"params\": [{
              \"from\": \"${WALLET_ADDRESS}\",
              \"to\": \"0x000000000000000000000000000000000000dead\",
              \"value\": \"0x0\",
              \"data\": \"${NONZERO_CALLDATA}\"
            }, \"latest\"],
            \"id\": 1
          }" \
          ${EL_RPC})

        ESTIMATE_HEX=$(echo "${ESTIMATE_JSON}" | jq -r '.result // empty')
        ESTIMATE=$(printf '%d' "${ESTIMATE_HEX}" 2>/dev/null || \
          python3 -c "print(int('${ESTIMATE_HEX}', 16))" 2>/dev/null || echo "0")

        echo "eth_estimateGas: ${ESTIMATE_HEX} = ${ESTIMATE} gas"
        echo "::set-output nonzeroBytesEstimate ${ESTIMATE}"

        FLOOR_NEW=18400
        LOWER_NEW=$((FLOOR_NEW - 200))
        UPPER_NEW=$((FLOOR_NEW + 400))
        FLOOR_OLD=27400
        LOWER_OLD=$((FLOOR_OLD - 200))
        UPPER_OLD=$((FLOOR_OLD + 600))

        if [ "${ESTIMATE}" -ge "${LOWER_NEW}" ] && [ "${ESTIMATE}" -le "${UPPER_NEW}" ]; then
          echo "PASS: Estimate ${ESTIMATE} matches EIP-2780+EIP-7976 floor range [${LOWER_NEW}, ${UPPER_NEW}]. ✓"
          echo "      floor = TX_BASE(12000) + 64×100 = 18400"
        elif [ "${ESTIMATE}" -ge "${LOWER_OLD}" ] && [ "${ESTIMATE}" -le "${UPPER_OLD}" ]; then
          echo "WARN: Estimate ${ESTIMATE} matches pre-EIP-2780 floor (27400 = 21000 + 6400)."
          echo "      EIP-2780 TX_BASE=12000 NOT implemented. EIP-7976 floor uses old TX_BASE=21000."
        else
          echo "WARN: Estimate ${ESTIMATE} does not match EIP-2780+7976 floor (18400) or pre-EIP-2780 floor (27400)."
        fi

  # ─── Test 5: Verify delta ≈ 0 (floor is length-only, not byte-value-based) ──
  - name: run_shell
    title: "Test 5: Verify delta ≈ 0: EIP-7976 floor treats zero and non-zero bytes equally"
    id: testDelta
    timeout: 5m
    config:
      shell: bash
      envVars:
        ZERO_ESTIMATE: tasks.testZeroBytes.outputs.zeroBytesEstimate
        NONZERO_ESTIMATE: tasks.testNonzeroBytes.outputs.nonzeroBytesEstimate
      command: |
        ZERO=$(echo $ZERO_ESTIMATE | jq -r 2>/dev/null || echo "$ZERO_ESTIMATE")
        NONZERO=$(echo $NONZERO_ESTIMATE | jq -r 2>/dev/null || echo "$NONZERO_ESTIMATE")

        echo "=== Test 5: Calldata Delta Verification ==="
        echo "100 zero bytes estimate:     ${ZERO}"
        echo "100 non-zero bytes estimate: ${NONZERO}"

        if [ -z "${ZERO}" ] || [ -z "${NONZERO}" ] || [ "${ZERO}" = "0" ] || [ "${NONZERO}" = "0" ]; then
          echo "WARN: Could not compute delta (missing estimates). Skipping."
          exit 0
        fi

        DELTA=$((NONZERO - ZERO))
        echo "Delta: ${NONZERO} - ${ZERO} = ${DELTA} gas"
        echo ""
        echo "Expected delta: 0 gas (EIP-7976 floor is length-only, not byte-value-based)"
        echo "  In Amsterdam, EIP-7976 floor = TX_BASE + 64×len(calldata)."
        echo "  Same length (100 bytes) → same floor (18400 or 27400) → same estimate."
        echo "  EIP-2780 4/16 gas/byte distinction is subsumed by the floor."

        if [ "${DELTA}" -ge -150 ] && [ "${DELTA}" -le 150 ]; then
          echo "PASS: Delta ${DELTA} ≈ 0 gas. ✓"
          echo "      EIP-7976 floor correctly treats zero and non-zero bytes equally."
        elif [ "${DELTA}" -ge 1100 ] && [ "${DELTA}" -le 1300 ]; then
          echo "FAIL: Delta ${DELTA} ≈ 1200 gas — EIP-7976 floor appears NOT active!"
          echo "      Pure EIP-2780 pricing (4/16 per byte) would give 1200 gas delta."
          echo "      Amsterdam requires EIP-7976 floor which makes delta = 0."
          exit 1
        else
          echo "WARN: Unexpected delta ${DELTA}. Expected ≈ 0 (EIP-7976 floor active)."
        fi

  - name: run_shell
    title: "Print EIP-2780 verification summary"
    timeout: 1m
    config:
      shell: bash
      envVars:
        BASE_GAS: tasks.testBase.outputs.baseGasUsed
        ZERO_EST: tasks.testZeroBytes.outputs.zeroBytesEstimate
        NONZERO_EST: tasks.testNonzeroBytes.outputs.nonzeroBytesEstimate
        EIP2780_IMPL: tasks.testDiscriminate.outputs.eip2780Implemented
      command: |
        BASE=$(echo $BASE_GAS | jq -r 2>/dev/null || echo "$BASE_GAS")
        ZERO=$(echo $ZERO_EST | jq -r 2>/dev/null || echo "$ZERO_EST")
        NONZERO=$(echo $NONZERO_EST | jq -r 2>/dev/null || echo "$NONZERO_EST")
        IMPL=$(echo $EIP2780_IMPL | jq -r 2>/dev/null || echo "$EIP2780_IMPL")
        echo "================================================================"
        echo "EIP-2780 + EIP-7976 Intrinsic Gas Summary (Amsterdam)"
        echo "================================================================"
        echo ""
        echo "EIP-2780 gas model (v6.0.0 EELS tag):"
        echo "  TX_BASE                = 12000    (was 21000)"
        echo "  TX_DATA_ZERO           = 4 gas    (per zero calldata byte, unchanged)"
        echo "  TX_DATA_NONZERO        = 16 gas   (per non-zero calldata byte, unchanged)"
        echo "  COLD_ACCOUNT_ACCESS    = 3000     (per non-self recipient)"
        echo "  TX_VALUE_COST          = 4244     (ETH value transfer, non-self)"
        echo "  TRANSFER_LOG_COST      = 1756     (ETH value transfer log, non-self)"
        echo "  → Non-self ETH transfer total: 12000+3000+4244+1756 = 21000 (same as before)"
        echo "  → Self-transfer total: TX_BASE = 12000 (was 21000)"
        echo ""
        echo "EIP-7976 floor (Amsterdam addition):"
        echo "  floor = TX_BASE + 64 × len(calldata) = 12000 + 64 × len"
        echo "  For 100 bytes: floor = 18400 (was 27400 with old TX_BASE=21000)"
        echo ""
        echo "Test 1 (gas=15000 self-transfer):   EIP-2780 implemented = ${IMPL}"
        echo "Test 2 (self-transfer gasUsed):      ${BASE}   (expected: 12000=EIP-2780, 21000=old)"
        echo "Test 3 (100 zero bytes estimate):    ${ZERO}  (expected: ~18400=EIP-2780, ~27400=old)"
        echo "Test 4 (100 non-zero bytes estimate): ${NONZERO}  (expected: ~18400=EIP-2780, ~27400=old)"
        echo "Test 5 (delta zero vs nonzero):      see above  (expected: ≈0 with EIP-7976 floor)"
        echo "================================================================"

cleanupTasks:
  - name: run_shell
    title: "Cleanup foundry temp dirs"
    config:
      shell: bash
      envVars:
        FOUNDRY_HOME: tasks.installFoundry.outputs.foundryHome
      command: |
        FOUNDRY_HOME=$(echo $FOUNDRY_HOME | jq -r)
        if [ ! -z "$FOUNDRY_HOME" ] && [ -d "$FOUNDRY_HOME" ]; then
          rm -rf "$FOUNDRY_HOME"
          echo "Cleaned up foundry temp dir"
        fi

id: glamsterdam-devnet-6-eip7981-access-list-gas
name: "glamsterdam-devnet-6: EIP-7981 access list storage key cost 2400→1900"
timeout: 1h
config:
  walletPrivkey: ""
  # EIP-7981: Reduces the intrinsic gas cost for each storage key in an EIP-2930
  # access list from 2400 to 1900. Also extends EIP-7976 calldata floor pricing
  # to access list entries.
  #
  # Access list floor (both EIP-2780 models):
  #   address floor = ACCESS_LIST_ADDRESS_FLOOR_TOKENS × TX_DATA_TOKEN_FLOOR
  #                 = 80 × 16 = 1280 gas/addr
  #   key floor     = ACCESS_LIST_STORAGE_KEY_FLOOR_TOKENS × TX_DATA_TOKEN_FLOOR
  #                 = 128 × 16 = 2048 gas/key
  #
  # EIP-2780 INTERACTION (Amsterdam v6.0.0 EELS tag):
  #   EIP-2780 changes TX_BASE (21000→12000) AND access list base costs:
  #     TX_ACCESS_LIST_ADDRESS     = COLD_ACCOUNT_ACCESS = 3000 (was 2400)
  #     TX_ACCESS_LIST_STORAGE_KEY = COLD_STORAGE_ACCESS = 3000 (was 1900)
  #
  # Two gas models:
  #   Pre-EIP-2780 (current geth, forks/amsterdam branch):
  #     TX_BASE                = 21000
  #     TX_ACCESS_LIST_ADDRESS = 2400
  #     TX_ACCESS_LIST_STORAGE_KEY = 1900 (EIP-7981 reduced from 2400)
  #     For 1 addr + 100 keys: 21000 + (2400+1280) + 100×(1900+2048) = 419480
  #     For 1 addr + 50 keys:  21000 + (2400+1280) + 50×(1900+2048) = 222080
  #
  #   Post-EIP-2780 (EELS v6.0.0 tag):
  #     TX_BASE                = 12000
  #     TX_ACCESS_LIST_ADDRESS = 3000 (= COLD_ACCOUNT_ACCESS)
  #     TX_ACCESS_LIST_STORAGE_KEY = 3000 (= COLD_STORAGE_ACCESS)
  #     For 1 addr + 100 keys: 12000 + (3000+1280) + 100×(3000+2048) = 521080
  #     For 1 addr + 50 keys:  12000 + (3000+1280) + 50×(3000+2048) = 268680
  #
  # Prague baseline (no EIP-7981 or floor):
  #   TX_BASE = 21000, access list = 2400 addr + 2400 key
  #   For 1 addr + 100 keys: 21000 + 2400 + 100×2400 = 263400

tasks:
  - name: check_clients_are_healthy
    title: "Check if at least one client is ready"
    id: clientCheck
    timeout: 5m
    config:
      minClientCount: 1

  - name: get_consensus_specs
    id: consensusSpecs
    title: "Get consensus chain specs"

  - name: check_consensus_slot_range
    title: "Wait for network to be stable (epoch 2)"
    timeout: 1h
    config:
      minEpochNumber: 2

  - name: generate_child_wallet
    id: testWallet
    title: "Generate funded wallet for access list tests"
    config:
      prefundMinBalance: 100000000000000000  # 0.1 ETH
      walletSeed: "eip7981-access-list-test"
    configVars:
      privateKey: "walletPrivkey"

  - name: run_shell
    title: "Install foundry (cast) for tx submission"
    id: installFoundry
    timeout: 10m
    config:
      shell: bash
      shellArgs: [--login]
      command: |
        set -e
        if [ -x "/opt/foundry/.foundry/bin/cast" ]; then
          FOUNDRY_HOME=/opt/foundry
          echo "Using pre-installed foundry: $(/opt/foundry/.foundry/bin/cast --version)"
        else
          FOUNDRY_HOME=$(mktemp -d -t foundry-XXXXXXXXXX)
          export SHELL=/bin/bash
          export HOME=${FOUNDRY_HOME}
          curl -L https://foundry.paradigm.xyz | bash
          source ${FOUNDRY_HOME}/.bashrc || true
          ${FOUNDRY_HOME}/.foundry/bin/foundryup
        fi
        echo "::set-output foundryHome ${FOUNDRY_HOME}"

  # ─── Test 0: Detect TX_BASE ───────────────────────────────────────────────────
  - name: run_shell
    title: "Test 0: Detect TX_BASE (12000=EIP-2780, 21000=pre-EIP-2780)"
    id: detectTxBase
    timeout: 5m
    config:
      shell: bash
      shellArgs: [--login]
      envVars:
        WALLET_PRIVKEY: tasks.testWallet.outputs.childWallet.privkey
        WALLET_ADDRESS: tasks.testWallet.outputs.childWallet.address
        EL_RPC: tasks.clientCheck.outputs.goodClients[0].elRpcUrl
        FOUNDRY_HOME: tasks.installFoundry.outputs.foundryHome
      command: |
        set -e
        WALLET_PRIVKEY=$(echo $WALLET_PRIVKEY | jq -r)
        WALLET_ADDRESS=$(echo $WALLET_ADDRESS | jq -r)
        EL_RPC=$(echo $EL_RPC | jq -r)
        FOUNDRY_HOME=$(echo $FOUNDRY_HOME | jq -r)
        export PATH="${FOUNDRY_HOME}/.foundry/bin:$PATH"
        export HOME=${FOUNDRY_HOME}

        echo "=== Test 0: TX_BASE detection ==="
        TX_JSON=$(cast send "${WALLET_ADDRESS}" --value 1 --private-key "${WALLET_PRIVKEY}" \
          --rpc-url "${EL_RPC}" --legacy --json 2>/dev/null)
        GAS_HEX=$(echo "${TX_JSON}" | jq -r '.gasUsed')
        GAS=$(printf '%d' "${GAS_HEX}" 2>/dev/null || python3 -c "print(int('${GAS_HEX}', 16))")
        echo "Self-transfer gasUsed: ${GAS}"
        echo "::set-output txBase ${GAS}"
        if [ "${GAS}" -eq 12000 ]; then
          echo "EIP-2780 ACTIVE: TX_BASE=12000 → access list base costs = COLD_ACCOUNT/STORAGE_ACCESS"
          echo "  TX_ACCESS_LIST_ADDRESS=3000, TX_ACCESS_LIST_STORAGE_KEY=3000"
        elif [ "${GAS}" -eq 21000 ]; then
          echo "Pre-EIP-2780: TX_BASE=21000 → legacy access list costs"
          echo "  TX_ACCESS_LIST_ADDRESS=2400, TX_ACCESS_LIST_STORAGE_KEY=1900 (EIP-7981)"
        else
          echo "WARN: unexpected TX_BASE=${GAS}"
        fi

  # ─── Test 1: eth_estimateGas for access list tx with 100 storage keys ─────────
  - name: run_shell
    title: "Test 1: eth_estimateGas for access list tx (1 addr + 100 keys)"
    id: testEstimateGas
    timeout: 5m
    config:
      shell: bash
      shellArgs: [--login]
      envVars:
        EL_RPC: tasks.clientCheck.outputs.goodClients[0].elRpcUrl
        TX_BASE: tasks.detectTxBase.outputs.txBase
      command: |
        set -e
        EL_RPC=$(echo $EL_RPC | jq -r)
        TX_BASE=$(echo $TX_BASE | jq -r 2>/dev/null || echo "$TX_BASE")

        echo "=== EIP-7981 Access List Storage Key Gas Cost Verification ==="
        echo "RPC: ${EL_RPC}"
        echo ""
        if [ "${TX_BASE}" -eq 12000 ]; then
          echo "TX_BASE=12000 (EIP-2780 active) — access list costs = COLD_ACCOUNT/STORAGE_ACCESS"
          echo "  1 addr + 100 keys: 12000 + (3000+1280)×1 + (3000+2048)×100 = 521080"
          EXPECTED_NEW=521080
          LOWER_NEW=515000
          UPPER_NEW=535000
          LOWER_LEGACY=255000
          UPPER_LEGACY=275000
        else
          echo "TX_BASE=21000 (pre-EIP-2780) — EIP-7981 legacy access list costs"
          echo "  1 addr + 100 keys: 21000 + (2400+1280)×1 + (1900+2048)×100 = 419480"
          EXPECTED_NEW=419480
          LOWER_NEW=415000
          UPPER_NEW=430000
          LOWER_LEGACY=255000
          UPPER_LEGACY=275000
        fi
        echo "  eth_estimateGas may overshoot by ≤1.5%"
        echo ""

        STORAGE_KEYS=$(python3 -c "
        keys = ['\"0x%064x\"' % i for i in range(100)]
        print(','.join(keys))
        ")

        ACCESS_LIST_JSON="[{\"address\":\"0x000000000000000000000000000000000000dead\",\"storageKeys\":[${STORAGE_KEYS}]}]"

        ESTIMATE_JSON=$(curl -s -X POST \
          -H "Content-Type: application/json" \
          --data "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"eth_estimateGas\",
            \"params\": [{
              \"type\": \"0x1\",
              \"to\": \"0x000000000000000000000000000000000000dead\",
              \"value\": \"0x0\",
              \"data\": \"0x\",
              \"accessList\": ${ACCESS_LIST_JSON}
            }, \"latest\"],
            \"id\": 1
          }" \
          ${EL_RPC})

        ESTIMATE_ERR=$(echo "${ESTIMATE_JSON}" | jq -r '.error // empty')
        if [ -n "${ESTIMATE_ERR}" ]; then
          echo "FAIL: eth_estimateGas returned error: ${ESTIMATE_ERR}"
          exit 1
        fi

        ESTIMATE_HEX=$(echo "${ESTIMATE_JSON}" | jq -r '.result // empty')
        ESTIMATE=$(printf '%d' "${ESTIMATE_HEX}" 2>/dev/null || \
          python3 -c "print(int('${ESTIMATE_HEX}', 16))" 2>/dev/null || echo "0")

        echo "eth_estimateGas result: ${ESTIMATE_HEX} = ${ESTIMATE} gas"
        echo "::set-output estimateGas ${ESTIMATE}"
        echo ""

        if [ "${ESTIMATE}" -ge "${LOWER_NEW}" ] && [ "${ESTIMATE}" -le "${UPPER_NEW}" ]; then
          echo "PASS: Gas estimate ${ESTIMATE} in expected range [${LOWER_NEW}, ${UPPER_NEW}]. ✓"
          if [ "${TX_BASE}" -eq 12000 ]; then
            echo "      EIP-7981+EIP-2780 access list costs (3000/key + 2048 floor) active. ✓"
          else
            echo "      EIP-7981 access list costs (1900/key + 2048 floor) active. ✓"
          fi
        elif [ "${ESTIMATE}" -ge "${LOWER_LEGACY}" ] && [ "${ESTIMATE}" -le "${UPPER_LEGACY}" ]; then
          echo "FAIL: Gas estimate ${ESTIMATE} is in Prague range [${LOWER_LEGACY}, ${UPPER_LEGACY}]."
          echo "      Storage key cost ~2400 with no floor (EIP-7981 NOT applied). ✗"
          exit 1
        else
          echo "WARN: Gas estimate ${ESTIMATE} outside expected range [${LOWER_NEW}, ${UPPER_NEW}]."
          echo "      Check if client is using correct access list costs."
          exit 1
        fi

  # ─── Test 2: Submit type-1 access list tx, verify gas_used from receipt ───────
  - name: run_shell
    title: "Test 2: Submit type-1 access list tx, verify gas_used from receipt (1 addr + 50 keys)"
    id: testOnChain
    timeout: 10m
    config:
      shell: bash
      shellArgs: [--login]
      envVars:
        WALLET_PRIVKEY: tasks.testWallet.outputs.childWallet.privkey
        WALLET_ADDRESS: tasks.testWallet.outputs.childWallet.address
        EL_RPC: tasks.clientCheck.outputs.goodClients[0].elRpcUrl
        FOUNDRY_HOME: tasks.installFoundry.outputs.foundryHome
        TX_BASE: tasks.detectTxBase.outputs.txBase
      command: |
        set -e
        WALLET_PRIVKEY=$(echo $WALLET_PRIVKEY | jq -r)
        WALLET_ADDRESS=$(echo $WALLET_ADDRESS | jq -r)
        EL_RPC=$(echo $EL_RPC | jq -r)
        FOUNDRY_HOME=$(echo $FOUNDRY_HOME | jq -r)
        TX_BASE=$(echo $TX_BASE | jq -r 2>/dev/null || echo "$TX_BASE")

        export PATH="${FOUNDRY_HOME}/.foundry/bin:$PATH"
        export SHELL=/bin/bash
        export HOME=${FOUNDRY_HOME}

        echo "=== EIP-7981 On-chain Access List Tx Test ==="
        echo "Wallet: ${WALLET_ADDRESS}"
        echo "RPC:    ${EL_RPC}"
        echo ""
        if [ "${TX_BASE}" -eq 12000 ]; then
          echo "Expected gas (EIP-2780 + EIP-7981, 1 addr + 50 keys):"
          echo "  12000 + (3000+1280)×1 + (3000+2048)×50 = 268680"
          LOWER_AMSTERDAM=264000
          UPPER_AMSTERDAM=276000
        else
          echo "Expected gas (pre-EIP-2780 + EIP-7981, 1 addr + 50 keys):"
          echo "  21000 + (2400+1280)×1 + (1900+2048)×50 = 222080"
          LOWER_AMSTERDAM=219000
          UPPER_AMSTERDAM=226000
        fi
        echo "  Prague: 21000 + 2400×1 + 2400×50 = 143400"
        echo ""

        ACCESS_LIST_CAST=$(python3 -c "
        addr = '0x000000000000000000000000000000000000dead'
        keys = ['0x%064x' % i for i in range(50)]
        print(addr + ':' + ','.join(keys))
        ")

        TX_JSON=$(cast send \
          "0x000000000000000000000000000000000000dead" \
          --value 0 \
          --private-key "${WALLET_PRIVKEY}" \
          --rpc-url "${EL_RPC}" \
          --type 1 \
          --access-list "${ACCESS_LIST_CAST}" \
          --json 2>/dev/null || echo "")

        if [ -z "${TX_JSON}" ]; then
          echo "WARN: cast send failed. The eth_estimateGas test (Test 1) is the primary verification."
          echo "::set-output onChainGasUsed skipped"
          exit 0
        fi

        TX_HASH=$(echo "${TX_JSON}" | jq -r '.transactionHash')
        TX_STATUS=$(echo "${TX_JSON}" | jq -r '.status')
        GAS_USED=$(echo "${TX_JSON}" | jq -r '.gasUsed')

        echo "Tx hash:   ${TX_HASH}"
        echo "Tx status: ${TX_STATUS}"
        echo "Gas used:  ${GAS_USED}"

        GAS_USED_DEC=$(printf '%d' "${GAS_USED}" 2>/dev/null || \
          python3 -c "print(int('${GAS_USED}', 16))" 2>/dev/null || echo "${GAS_USED}")
        echo "Gas used (decimal): ${GAS_USED_DEC}"
        echo "::set-output onChainGasUsed ${GAS_USED_DEC}"

        if [ "${TX_STATUS}" != "0x1" ] && [ "${TX_STATUS}" != "1" ]; then
          echo "FAIL: Type-1 access list tx failed (status=${TX_STATUS})"
          exit 1
        fi

        LOWER_PRAGUE=138000
        UPPER_PRAGUE=150000

        if [ "${GAS_USED_DEC}" -ge "${LOWER_AMSTERDAM}" ] && [ "${GAS_USED_DEC}" -le "${UPPER_AMSTERDAM}" ]; then
          echo "PASS: gas_used ${GAS_USED_DEC} in expected range [${LOWER_AMSTERDAM}, ${UPPER_AMSTERDAM}]. ✓"
        elif [ "${GAS_USED_DEC}" -ge "${LOWER_PRAGUE}" ] && [ "${GAS_USED_DEC}" -le "${UPPER_PRAGUE}" ]; then
          echo "FAIL: gas_used ${GAS_USED_DEC} in Prague range [${LOWER_PRAGUE}, ${UPPER_PRAGUE}]."
          echo "      Storage key cost ~2400 with no floor (EIP-7981 NOT applied). ✗"
          exit 1
        else
          echo "WARN: gas_used ${GAS_USED_DEC} outside expected ranges."
          echo "      Check access list pricing."
          exit 1
        fi

  - name: run_shell
    title: "Print EIP-7981 verification summary"
    timeout: 1m
    config:
      shell: bash
      envVars:
        TX_BASE: tasks.detectTxBase.outputs.txBase
        ESTIMATE_GAS: tasks.testEstimateGas.outputs.estimateGas
        ON_CHAIN_GAS: tasks.testOnChain.outputs.onChainGasUsed
      command: |
        TX_BASE=$(echo $TX_BASE | jq -r 2>/dev/null || echo "$TX_BASE")
        ESTIMATE_GAS=$(echo $ESTIMATE_GAS | jq -r 2>/dev/null || echo "$ESTIMATE_GAS")
        ON_CHAIN_GAS=$(echo $ON_CHAIN_GAS | jq -r 2>/dev/null || echo "$ON_CHAIN_GAS")
        echo "================================================================"
        echo "EIP-7981 Access List Storage Key Gas Cost Verification Summary"
        echo "================================================================"
        echo ""
        echo "TX_BASE detected: ${TX_BASE} (12000=EIP-2780 active, 21000=pre-EIP-2780)"
        echo ""
        echo "Access list floor costs (unchanged across both models):"
        echo "  address floor = 20 bytes × 4 tok/byte × 16 gas/tok = 1280 gas/addr"
        echo "  key floor     = 32 bytes × 4 tok/byte × 16 gas/tok = 2048 gas/key"
        echo ""
        if [ "${TX_BASE}" -eq 12000 ]; then
          echo "EIP-2780 + EIP-7981 model (TX_BASE=12000):"
          echo "  TX_ACCESS_LIST_ADDRESS     = 3000 (= COLD_ACCOUNT_ACCESS)"
          echo "  TX_ACCESS_LIST_STORAGE_KEY = 3000 (= COLD_STORAGE_ACCESS)"
          echo "  1 addr + 100 keys → 521080; 1 addr + 50 keys → 268680"
        else
          echo "Pre-EIP-2780 + EIP-7981 model (TX_BASE=21000):"
          echo "  TX_ACCESS_LIST_ADDRESS     = 2400 (unchanged)"
          echo "  TX_ACCESS_LIST_STORAGE_KEY = 1900 (EIP-7981: reduced from 2400)"
          echo "  1 addr + 100 keys → 419480; 1 addr + 50 keys → 222080"
        fi
        echo ""
        echo "Test 1 (eth_estimateGas, 1 addr + 100 keys): ${ESTIMATE_GAS}"
        echo "Test 2 (on-chain, 1 addr + 50 keys):         ${ON_CHAIN_GAS}"
        echo "================================================================"

cleanupTasks:
  - name: run_shell
    title: "Cleanup foundry temp dirs"
    config:
      shell: bash
      envVars:
        FOUNDRY_HOME: tasks.installFoundry.outputs.foundryHome
      command: |
        FOUNDRY_HOME=$(echo $FOUNDRY_HOME | jq -r)
        if [ ! -z "$FOUNDRY_HOME" ] && [ -d "$FOUNDRY_HOME" ]; then
          rm -rf "$FOUNDRY_HOME"
          echo "Cleaned up foundry temp dir"
        fi
